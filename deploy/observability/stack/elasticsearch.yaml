apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: meshshop
spec:
  version: 9.5.6
  # Least privilege: people use meshshop-viewer (read-only), kibana/setup.sh uses
  # meshshop-setup. Passwords are generated by install.sh into these Secrets; the
  # "elastic" superuser is kept for break-glass only.
  auth:
    roles:
      - secretName: meshshop-es-roles
    fileRealm:
      - secretName: meshshop-viewer-user
      - secretName: meshshop-setup-user
  nodeSets:
    - name: default
      count: 1   # single node for local dev; replicas would stay unassigned anyway
      config:
        node.store.allow_mmap: false
        # Disk watermarks as absolute free space (minikube volumes report the host
        # disk, so percentages misfire). Past flood_stage, writes block and Logstash
        # back-pressures instead of corrupting indices.
        cluster.routing.allocation.disk.watermark.low: 3gb
        cluster.routing.allocation.disk.watermark.high: 2gb
        cluster.routing.allocation.disk.watermark.flood_stage: 1gb
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
              resources:
                requests: { cpu: 250m, memory: 2Gi }
                limits: { cpu: "2", memory: 2Gi }
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
