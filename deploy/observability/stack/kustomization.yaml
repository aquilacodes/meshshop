apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
labels:
  - pairs:
      app.kubernetes.io/part-of: meshshop-observability
    includeSelectors: false
resources:
  - namespace.yaml
  - elasticsearch.yaml
  - kibana.yaml
  - apm-server.yaml
  - otel-collector.yaml
  - logstash.yaml
  - roles.yaml
  - network-policies.yaml
configMapGenerator:
  - name: logstash-pipeline
    files:
      - logstash/meshshop.conf
generatorOptions:
  # The Logstash CR mounts this by name; Logstash hot-reloads the file on change.
  disableNameSuffixHash: true
