# meshshop log pipeline: Filebeat -> (parse, ECS-map, correlate) -> Elasticsearch
#
# Output data streams:
#   logs-meshshop.app-default      application JSON logs (container "app")
#   logs-meshshop.envoy-default    Envoy access logs (sidecars + ingress gateway)
#   logs-meshshop.platform-default everything else we collect (istiod, proxy warnings)

input {
  # Mutual TLS: only a client certificate issued by the meshshop CA (Filebeat's)
  # may ship logs. Certificates: scripts/certs.sh -> Secret logstash-beats-tls.
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/beats-tls/tls.crt"
    ssl_key => "/usr/share/logstash/beats-tls/tls.key"
    ssl_certificate_authorities => ["/usr/share/logstash/beats-tls/ca.crt"]
    ssl_client_authentication => "required"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
  }
}

filter {
  mutate {
    add_field => { "[data_stream][type]" => "logs" "[data_stream][namespace]" => "default" }
    copy      => { "[kubernetes][labels][app]" => "[service][name]" }
  }
  if [kubernetes][labels][meshshop_io/layer] {
    mutate { copy => { "[kubernetes][labels][meshshop_io/layer]" => "[labels][layer]" } }
  }

  # ---- application logs (slog JSON) ----------------------------------------
  if [kubernetes][container][name] == "app" and [message] =~ /^\{/ {
    json { source => "message" target => "app" }
    mutate { add_field => { "[data_stream][dataset]" => "meshshop.app" } }
    date { match => ["[app][time]", "ISO8601"] }

    mutate {
      rename => {
        "[app][service]"    => "[service][name]"
        "[app][layer]"      => "[labels][layer]"
        "[app][trace_id]"   => "[trace][id]"
        "[app][span_id]"    => "[span][id]"
        "[app][request_id]" => "[http][request][id]"
        "[app][method]"     => "[http][request][method]"
        "[app][status]"     => "[http][response][status_code]"
        "[app][path]"       => "[url][path]"
      }
    }
    if [app][level] {
      mutate { lowercase => ["[app][level]"] rename => { "[app][level]" => "[log][level]" } }
    }
    if [app][msg] == "request" {
      mutate { replace => { "message" => "%{[http][request][method]} %{[url][path]} %{[http][response][status_code]} (%{[app][duration_ms]}ms)" } }
    } else {
      mutate { replace => { "message" => "%{[app][msg]}" } }
    }
    if [app][err] {
      mutate { rename => { "[app][err]" => "[error][message]" } }
    }
    mutate { remove_field => ["[app][time]", "[app][msg]"] }

  # ---- Envoy access logs (sidecars + gateway) --------------------------------
  } else if [kubernetes][container][name] == "istio-proxy" and [message] =~ /^\{/ {
    json { source => "message" target => "envoy" }

    # Trace export from the apps to the collector is not interesting traffic.
    if [envoy][authority] =~ /^otel-collector/ or [envoy][upstream_cluster] =~ /otel-collector/ {
      drop {}
    }

    mutate { add_field => { "[data_stream][dataset]" => "meshshop.envoy" "[event][category]" => "web" } }
    date { match => ["[envoy][start_time]", "ISO8601"] }

    if [envoy][upstream_cluster] =~ /^inbound\|/ {
      mutate { add_field => { "[envoy][direction]" => "inbound" } }
    } else if [envoy][upstream_cluster] =~ /^outbound\|/ {
      mutate { add_field => { "[envoy][direction]" => "outbound" } }
    }

    mutate {
      convert => {
        "[envoy][response_code]"  => "integer"
        "[envoy][duration]"       => "integer"
        "[envoy][bytes_sent]"     => "integer"
        "[envoy][bytes_received]" => "integer"
      }
      copy => {
        "[envoy][method]"        => "[http][request][method]"
        "[envoy][response_code]" => "[http][response][status_code]"
        "[envoy][path]"          => "[url][original]"
        "[envoy][request_id]"    => "[http][request][id]"
        "[envoy][user_agent]"    => "[user_agent][original]"
      }
    }

    # traceparent = 00-<trace id>-<parent span id>-<flags>
    if [envoy][traceparent] =~ /^00-[0-9a-f]{32}-/ {
      grok { match => { "[envoy][traceparent]" => "^00-%{BASE16NUM:[trace][id]}-%{BASE16NUM:[envoy][parent_span_id]}-" } }
    }

    if [envoy][response_code_details] =~ /^rbac_access_denied/ {
      mutate { add_field => { "[event][type]" => "denied" "[envoy][rbac_denied]" => "true" } }
      mutate { convert => { "[envoy][rbac_denied]" => "boolean" } }
    }

    ruby {
      code => '
        d = event.get("[envoy][duration]")
        event.set("[event][duration]", d.to_i * 1_000_000) if d
        code = event.get("[envoy][response_code]").to_i
        event.set("[event][outcome]", code >= 500 || code == 0 ? "failure" : "success")
        event.set("[log][level]", code >= 500 || code == 0 ? "error" : (code >= 400 ? "warn" : "info"))

        # Readable one-liner, e.g.
        #   inbound POST inventory:8080/v1/reservations 409 0ms - from=ns/meshshop/sa/shopping
        dir = event.get("[envoy][direction]") || "-"
        msg = [dir, event.get("[envoy][method]"),
               "#{event.get("[envoy][authority]")}#{event.get("[envoy][path]")}",
               code, "#{d}ms", event.get("[envoy][response_flags]")].join(" ")
        peer = dir == "inbound" ? event.get("[envoy][downstream_peer]") : event.get("[envoy][upstream_peer]")
        if peer.is_a?(String) && !peer.empty?
          msg += (dir == "inbound" ? " from=" : " to=") + peer.sub(%r{^spiffe://[^/]+/}, "")
        end
        event.set("message", msg)
      '
    }

  # ---- everything else (istiod, non-JSON proxy output) ------------------------
  } else {
    mutate { add_field => { "[data_stream][dataset]" => "meshshop.platform" } }
    # Istio's own log format: "<time>\t<level>\t[<scope>\t]<message>"
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:[istio][time]}\t%{LOGLEVEL:[log][level]}\t(?:%{NOTSPACE:[istio][scope]}\t)?%{GREEDYDATA:[istio][message]}" }
      tag_on_failure => []
    }
    if [istio][time] {
      date { match => ["[istio][time]", "ISO8601"] }
      mutate {
        replace      => { "message" => "%{[istio][message]}" }
        remove_field => ["[istio][time]", "[istio][message]"]
      }
    }
  }

  mutate { remove_field => ["agent", "ecs", "input", "[log][offset]", "stream", "tags"] }
}

output {
  elasticsearch {
    hosts                       => ["${ES_ES_HOSTS}"]
    user                        => "${ES_ES_USER}"
    password                    => "${ES_ES_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => "${ES_ES_SSL_CERTIFICATE_AUTHORITY}"
    data_stream                 => true
  }
}
