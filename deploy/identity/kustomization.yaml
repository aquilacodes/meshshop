apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
labels:
  - pairs:
      app.kubernetes.io/part-of: meshshop
    includeSelectors: false
resources:
  - namespace.yaml
  - keycloak.yaml
  - mesh.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm/meshshop-realm.json
