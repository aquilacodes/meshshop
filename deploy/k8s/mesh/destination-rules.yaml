# Per-service connection pool, outlier detection, and version subsets.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: web-bff
spec:
  host: web-bff
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 0
    outlierDetection:            # eject a pod after repeated 5xx
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1                   # add v2 here for canary releases
      labels: { version: v1 }
---
