name: Security finding
description: A weakness or hardening item. Don't put exploitable details for a live deployment in a public issue.
labels: ["type:security"]
projects: ["aquilacodes/7"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [High, Medium, Low, Info]
    validations: { required: true }
  - type: input
    id: owasp
    attributes:
      label: OWASP category
      placeholder: "A01, API1"
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What is wrong, where, and the impact.
    validations: { required: true }
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
  - type: textarea
    id: test
    attributes:
      label: Regression check
      description: The check to add to scripts/security.sh.
